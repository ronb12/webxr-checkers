<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bradley Checkers</title>
<meta name="theme-color" content="#080808">
<meta name="description" content="Bradley Checkers — 3D checkers for VR, desktop, phone and tablet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bradley Checkers">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2">
<link rel="shortcut icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png?v=2">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,sans-serif;
}
#hud{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  width:min(520px,92vw);
  color:white;
  text-align:center;
  background:linear-gradient(180deg,rgba(18,18,18,.96),rgba(3,3,3,.90));
  padding:10px 14px 9px;
  border:1px solid #c9a227;
  border-radius:14px;
  box-shadow:0 10px 32px rgba(0,0,0,.5),inset 0 0 18px rgba(201,162,39,.08);
  pointer-events:none;
  box-sizing:border-box;
}
#title{
  color:#ffd95a;
  font-weight:900;
  font-size:18px;
  letter-spacing:1.4px;
}
#matchLabel{
  margin-top:1px;
  color:#9e9e9e;
  font-size:9px;
  letter-spacing:2.4px;
}
#players{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin-top:7px;
}
.playerPanel{
  display:grid;
  grid-template-columns:auto 34px;
  grid-template-rows:auto auto;
  align-items:center;
  column-gap:9px;
  padding:6px 10px;
  border-radius:9px;
  background:rgba(255,255,255,.035);
}
.redPanel{border:1px solid rgba(217,31,38,.65)}
.blackPanel{border:1px solid rgba(220,220,220,.32)}
.playerName{
  text-align:left;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;
}
.playerScore{
  grid-row:1 / 3;
  grid-column:2;
  font-size:26px;
  line-height:1;
  font-weight:900;
}
.redPanel .playerScore{color:#ff4048}
.blackPanel .playerScore{color:#f2f2f2}
.playerStats{
  display:flex;
  gap:9px;
  margin-top:3px;
  color:#8f8f8f;
  font-size:8px;
  white-space:nowrap;
}
.playerStats b{color:#ffd95a}
.vs{
  color:#ffd95a;
  font-size:10px;
  font-weight:900;
}
#status{
  display:inline-block;
  margin-top:7px;
  padding:3px 12px;
  border-radius:999px;
  background:rgba(201,162,39,.10);
  color:#fff1ae;
  font-size:11px;
  font-weight:800;
  letter-spacing:.8px;
}

#controls{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  gap:8px;
}
button{
  padding:10px 14px;
  border:1px solid #c9a227;
  border-radius:9px;
  background:#151515;
  color:white;
  cursor:pointer;
}
button:hover{background:#292929}

/* PHONE / TABLET PLAYERS */
@media (max-width:700px){
  #hud{
    top:6px;
    width:calc(100vw - 12px);
    padding:6px 8px;
    border-radius:10px;
  }
  #title{font-size:14px}
  #matchLabel{font-size:8px}
  #players{gap:5px;margin-top:4px}
  .playerPanel{
    grid-template-columns:auto 28px;
    column-gap:4px;
    padding:4px 6px;
  }
  .playerName{font-size:9px}
  .playerScore{font-size:20px}
  .playerStats{font-size:7px;gap:4px}
  #status{margin-top:4px;font-size:9px;padding:3px 8px}
  #controls{
    bottom:max(8px,env(safe-area-inset-bottom));
    width:calc(100vw - 12px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
  }
  #controls button{
    min-height:42px;
    padding:6px 4px;
    font-size:11px;
    touch-action:manipulation;
  }
  #playerSetup>div{
    width:calc(100vw - 32px)!important;
    max-height:calc(100vh - 32px);
    overflow:auto;
    box-sizing:border-box;
    padding:18px!important;
  }
  #playerNameInput{
    width:100%!important;
    box-sizing:border-box;
    min-height:46px;
    font-size:16px!important;
  }
  #savePlayerName{
    width:100%;
    min-height:46px;
  }
}
@media (max-width:380px){
  #controls{grid-template-columns:repeat(2,1fr)}
  .playerStats{display:none}
}

/* LANDSCAPE PHONE / SHORT TABLET: keep the board clear for actual play. */
@media (orientation:landscape) and (max-height:600px){
  #hud{
    top:4px;
    width:min(430px,58vw);
    padding:4px 7px;
  }
  #title{font-size:12px}
  #matchLabel{display:none}
  #players{margin-top:2px;gap:4px}
  .playerPanel{padding:3px 6px}
  .playerName{font-size:8px}
  .playerScore{font-size:18px}
  .playerStats{display:none}
  #status{margin-top:2px;padding:2px 6px;font-size:8px}
  #controls{
    bottom:max(4px,env(safe-area-inset-bottom));
    width:calc(100vw - 10px);
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:4px;
  }
  #controls button{
    min-height:34px;
    padding:4px 3px;
    font-size:10px;
    touch-action:manipulation;
  }
  #playerSetup>div{
    max-height:calc(100vh - 16px);
    padding:10px 16px!important;
  }
  #playerSetup h2{margin:0 0 4px!important;font-size:18px}
  #playerSetup p{margin:5px 0;font-size:12px!important}
  #playerNameInput{min-height:38px}
  #savePlayerName{min-height:38px;margin-top:6px!important}
}

/* TABLETS: maintain comfortable touch targets in either orientation. */
@media (min-width:701px) and (max-width:1100px) and (pointer:coarse){
  #controls button{min-height:44px;touch-action:manipulation}
}
</style>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="hud">
  <div id="title">BRADLEY CHECKERS</div>

  <div id="matchLabel">VR MATCH</div>

  <div id="players">

    <div class="playerPanel redPanel">
      <div class="playerName">RED</div>
      <div id="redScore" class="playerScore">12</div>
      <div class="playerStats">
        <span>CAPTURES <b id="redCaptures">0</b></span>
        <span>KINGS <b id="redKings">0</b></span>
      </div>
    </div>

    <div class="vs">VS</div>

    <div class="playerPanel blackPanel">
      <div class="playerName">BLACK</div>
      <div id="blackScore" class="playerScore">12</div>
      <div class="playerStats">
        <span>CAPTURES <b id="blackCaptures">0</b></span>
        <span>KINGS <b id="blackKings">0</b></span>
      </div>
    </div>

  </div>

  <div id="status">RED'S TURN</div>
</div>

<div id="playerSetup" style="position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;color:white;">
  <div style="width:min(420px,88vw);padding:24px;border:1px solid #c9a227;border-radius:16px;background:#111;text-align:center;">
    <h2 style="color:#ffd95a;margin-top:0">BRADLEY CHECKERS</h2>
    <p>Enter your player name. This name will be locked to this headset/browser for leaderboard scores.</p>
    <p style="color:#ffd95a;font-weight:700;font-size:14px">⚠️ PRIVACY: Do not enter your real name. Use your player/gamer name only.</p>
    <input id="playerNameInput" maxlength="20" placeholder="Player name" style="width:80%;padding:12px;border-radius:8px;border:1px solid #c9a227;background:#080808;color:white;font-size:16px">
    <button id="savePlayerName" style="margin-top:12px">Enter Championship Lounge</button>
  </div>
</div>

<div id="controls">
  <button id="restart">Restart</button>
<button id="gameMode">Human vs AI</button>
<button id="difficulty">AI: Medium</button>
<button id="hostOnline">Host Online</button>
<button id="joinOnline">Join Online</button>
<button id="invitePlayer">Invite Player</button>
  <button id="mode">Wall / Table</button>
</div>

<script type="module">

import * as THREE from 'three';
import {VRButton} from 'three/addons/webxr/VRButton.js';
import {Peer} from 'https://esm.sh/peerjs@1.5.5';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080808);

const camera=new THREE.PerspectiveCamera(
  70,
  innerWidth/innerHeight,
  .01,
  100
);

/*
PLAYER RIG

The Quest controls the camera's head movement.
The rig controls where the player stands in the world.

Board = Z 0
Player rig = Z +3.5
*/

camera.position.set(0,2.9,5.8);
camera.lookAt(0,0.85,0);

const playerRig=new THREE.Group();
playerRig.position.set(0,0,6.45);

playerRig.add(camera);
scene.add(playerRig);

const renderer=new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
renderer.shadowMap.enabled=true;

/* DESKTOP CAMERA / QUEST CAMERA */

function updateDesktopCamera(){

  if(renderer.xr.isPresenting)
    return;

  /* Desktop view must not inherit
     the VR player's 3.5m offset. */

  playerRig.position.set(
    0,
    0,
    0
  );

  camera.position.set(
    0,
    2.9,
    5.8
  );

  camera.lookAt(
    0,
    0.85,
    0
  );

}

updateDesktopCamera();

/* Restore the VR player distance when entering VR. */

renderer.xr.addEventListener(
  'sessionstart',
  ()=>{
    playerRig.position.set(
      0,
      0,
      6.45
    );
    /* Face into the lounge from the spawn point. */
    playerRig.rotation.y=Math.PI;
  }
);

renderer.xr.addEventListener(
  'sessionend',
  ()=>{
    updateDesktopCamera();
  }
);

window.addEventListener(
  'resize',
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    updateDesktopCamera();
  }
);

document.body.appendChild(renderer.domElement);
const vrButton=VRButton.createButton(renderer);
document.body.appendChild(vrButton);

/* Meta Horizon immersive PWA launch.
   In a packaged Quest PWA, the app-icon launch counts as user activation, so
   Meta allows an immersive WebXR session to be requested immediately. Browser
   users still get the normal ENTER VR button. */
async function autoEnterMetaPWA(){
  const metaPwaLaunch=new URLSearchParams(location.search).get('source')==='pwa' || window.getDigitalGoodsService!==undefined;
  if(!metaPwaLaunch || !navigator.xr || renderer.xr.isPresenting) return;
  try{
    if(!(await navigator.xr.isSessionSupported('immersive-vr'))) return;
    const session=await navigator.xr.requestSession('immersive-vr',{
      optionalFeatures:['local-floor','bounded-floor','hand-tracking','layers']
    });
    await renderer.xr.setSession(session);
  }catch(err){
    console.warn('Meta PWA immersive auto-start unavailable; ENTER VR remains available.',err);
  }
}
setTimeout(autoEnterMetaPWA,250);

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x333333,
    2.4
  )
);

const keyLight=new THREE.DirectionalLight(
  0xffffff,
  3
);

keyLight.position.set(2,4,4);
keyLight.castShadow=true;
scene.add(keyLight);

const goldLight=new THREE.PointLight(
  0xffc83d,
  5,
  7
);

goldLight.position.set(0,2.8,2);
scene.add(goldLight);


/* ROOM */

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(12,12),
  new THREE.MeshStandardMaterial({
    color:0x181818,
    roughness:.65
  })
);

floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const wall=new THREE.Mesh(
  new THREE.BoxGeometry(6,3.5,.12),
  new THREE.MeshStandardMaterial({
    color:0x202020,
    roughness:.7
  })
);

wall.position.set(0,1.7,-.28);
wall.receiveShadow=true;
scene.add(wall);

/* PREMIUM CHECKERS LOUNGE */

const roomGroup=new THREE.Group();
scene.add(roomGroup);

const backPanel=new THREE.Mesh(
  new THREE.BoxGeometry(3.35,2.55,.10),
  new THREE.MeshStandardMaterial({
    color:0x101010,
    roughness:.42,
    metalness:.18
  })
);
backPanel.position.set(0,1.65,-.20);
roomGroup.add(backPanel);

const trimMat=new THREE.MeshStandardMaterial({
  color:0xc9a227,
  metalness:.88,
  roughness:.20
});

for(const x of [-1.70,1.70]){
  const trim=new THREE.Mesh(
    new THREE.BoxGeometry(.035,2.62,.055),
    trimMat
  );
  trim.position.set(x,1.65,-.12);
  roomGroup.add(trim);
}

const topTrim=new THREE.Mesh(
  new THREE.BoxGeometry(3.43,.035,.055),
  trimMat
);
topTrim.position.set(0,2.96,-.12);
roomGroup.add(topTrim);

const stage=new THREE.Mesh(
  new THREE.CylinderGeometry(1.55,1.70,.16,48),
  new THREE.MeshStandardMaterial({
    color:0x111111,
    roughness:.30,
    metalness:.35
  })
);
stage.position.set(0,.08,.12);
stage.receiveShadow=true;
roomGroup.add(stage);

const stageRing=new THREE.Mesh(
  new THREE.TorusGeometry(1.60,.025,12,64),
  trimMat
);
stageRing.rotation.x=Math.PI/2;
stageRing.position.set(0,.17,.12);
roomGroup.add(stageRing);

for(const x of [-2.15,2.15]){
  const column=new THREE.Mesh(
    new THREE.CylinderGeometry(.08,.10,2.55,24),
    new THREE.MeshStandardMaterial({
      color:0x151515,
      metalness:.35,
      roughness:.28
    })
  );
  column.position.set(x,1.28,-.08);
  roomGroup.add(column);

  const lamp=new THREE.PointLight(
    0xffc83d,
    3.0,
    3.6
  );
  lamp.position.set(x,2.35,.55);
  roomGroup.add(lamp);
}

const boardGlow=new THREE.PointLight(
  0xffdf7a,
  3.2,
  3.8
);
boardGlow.position.set(0,2.25,1.15);
roomGroup.add(boardGlow);

/* IMMERSIVE VR ROOM DETAILS */

const sideWallMat=new THREE.MeshStandardMaterial({
  color:0x0d0d0f,
  roughness:.58,
  metalness:.10
});

for(const x of [-3.0,3.0]){
  const sideWall=new THREE.Mesh(
    new THREE.BoxGeometry(.12,3.5,6.2),
    sideWallMat
  );
  sideWall.position.set(x,1.75,2.65);
  sideWall.receiveShadow=true;
  roomGroup.add(sideWall);
}

const ceiling=new THREE.Mesh(
  new THREE.BoxGeometry(6.1,.10,6.2),
  new THREE.MeshStandardMaterial({
    color:0x090909,
    roughness:.62
  })
);
ceiling.position.set(0,3.48,2.65);
roomGroup.add(ceiling);

const floorInset=new THREE.Mesh(
  new THREE.PlaneGeometry(5.4,5.6),
  new THREE.MeshStandardMaterial({
    color:0x111114,
    roughness:.32,
    metalness:.22
  })
);
floorInset.rotation.x=-Math.PI/2;
floorInset.position.set(0,.012,2.4);
floorInset.receiveShadow=true;
roomGroup.add(floorInset);

for(const x of [-2.72,2.72]){
  const floorTrim=new THREE.Mesh(
    new THREE.BoxGeometry(.025,.018,5.4),
    trimMat
  );
  floorTrim.position.set(x,.025,2.35);
  roomGroup.add(floorTrim);
}

for(const x of [-2.92,2.92]){
  for(const z of [.5,2.1,3.7,5.3]){
    const sconceBase=new THREE.Mesh(
      new THREE.BoxGeometry(.08,.32,.22),
      new THREE.MeshStandardMaterial({
        color:0x151515,
        metalness:.65,
        roughness:.25
      })
    );
    sconceBase.position.set(x,2.05,z);
    roomGroup.add(sconceBase);

    const sconceLight=new THREE.PointLight(
      0xffb84d,
      1.15,
      2.2
    );
    sconceLight.position.set(x*.94,2.08,z);
    roomGroup.add(sconceLight);
  }
}

for(const z of [.55,2.05,3.55,5.05]){
  const beam=new THREE.Mesh(
    new THREE.BoxGeometry(5.65,.035,.055),
    trimMat
  );
  beam.position.set(0,3.38,z);
  roomGroup.add(beam);
}

const centerLight=new THREE.PointLight(
  0xffe3a1,
  2.6,
  4.8
);
centerLight.position.set(0,3.20,1.15);
roomGroup.add(centerLight);

const redAccent=new THREE.PointLight(
  0xaa1018,
  1.35,
  3.0
);
redAccent.position.set(-2.15,1.15,1.25);
roomGroup.add(redAccent);

const goldAccent=new THREE.PointLight(
  0xffc83d,
  1.5,
  3.0
);
goldAccent.position.set(2.15,1.15,1.25);
roomGroup.add(goldAccent);

/* REALISM PASS: layered materials, furniture and architectural depth */

const marbleMat=new THREE.MeshPhysicalMaterial({
  color:0x161619,
  roughness:.20,
  metalness:.12,
  clearcoat:.75,
  clearcoatRoughness:.16
});

const woodMat=new THREE.MeshStandardMaterial({
  color:0x24140c,
  roughness:.34,
  metalness:.08
});

const leatherMat=new THREE.MeshPhysicalMaterial({
  color:0x18181b,
  roughness:.38,
  metalness:.04,
  clearcoat:.25,
  clearcoatRoughness:.35
});

const brassMat=new THREE.MeshStandardMaterial({
  color:0xb58a2a,
  metalness:.92,
  roughness:.22
});

/* Marble center runner */
const marbleRunner=new THREE.Mesh(
  new THREE.BoxGeometry(2.65,.035,4.8),
  marbleMat
);
marbleRunner.position.set(0,.035,2.55);
marbleRunner.receiveShadow=true;
roomGroup.add(marbleRunner);

/* Recessed wall panels */
for(const x of [-2.35,-1.18,1.18,2.35]){
  const panel=new THREE.Mesh(
    new THREE.BoxGeometry(.78,1.65,.035),
    new THREE.MeshStandardMaterial({
      color:0x151519,
      roughness:.46,
      metalness:.14
    })
  );
  panel.position.set(x,1.72,-.115);
  roomGroup.add(panel);

  const panelTop=new THREE.Mesh(
    new THREE.BoxGeometry(.84,.025,.045),
    brassMat
  );
  panelTop.position.set(x,2.56,-.085);
  roomGroup.add(panelTop);

  const panelBottom=panelTop.clone();
  panelBottom.position.y=.88;
  roomGroup.add(panelBottom);
}

/* Luxury benches along spectator sides */
for(const x of [-2.48,2.48]){
  for(const z of [1.55,3.25,4.75]){
    const seat=new THREE.Mesh(
      new THREE.BoxGeometry(.72,.18,.78),
      leatherMat
    );
    seat.position.set(x,.48,z);
    seat.castShadow=true;
    roomGroup.add(seat);

    const back=new THREE.Mesh(
      new THREE.BoxGeometry(.72,.70,.16),
      leatherMat
    );
    back.position.set(x + (x<0 ? -.28 : .28),.78,z);
    back.rotation.y=Math.PI/2;
    back.castShadow=true;
    roomGroup.add(back);

    const base=new THREE.Mesh(
      new THREE.BoxGeometry(.54,.30,.58),
      woodMat
    );
    base.position.set(x,.25,z);
    roomGroup.add(base);
  }
}

/* Brass ceiling fixtures */
for(const z of [1.0,2.65,4.3]){
  const fixture=new THREE.Mesh(
    new THREE.CylinderGeometry(.30,.30,.045,32),
    brassMat
  );
  fixture.position.set(0,3.36,z);
  roomGroup.add(fixture);

  const glow=new THREE.PointLight(
    0xffe1a0,
    1.65,
    3.0
  );
  glow.position.set(0,3.20,z);
  roomGroup.add(glow);
}

/* Realistic Bradley Checkers championship trophies */
for(const x of [-2.18,2.18]){
  const trophy=new THREE.Group();

  const pedestal=new THREE.Mesh(new THREE.BoxGeometry(.46,.66,.46),marbleMat);
  pedestal.position.y=.33;
  pedestal.castShadow=true;
  trophy.add(pedestal);

  const base=new THREE.Mesh(new THREE.BoxGeometry(.30,.09,.25),woodMat);
  base.position.y=.705;
  base.castShadow=true;
  trophy.add(base);

  const gold=new THREE.MeshPhysicalMaterial({
    color:0xffc83d,metalness:1,roughness:.12,
    clearcoat:1,clearcoatRoughness:.08
  });

  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.055,.20,24),gold);
  stem.position.y=.84;
  trophy.add(stem);

  const foot=new THREE.Mesh(new THREE.CylinderGeometry(.105,.13,.055,32),gold);
  foot.position.y=.755;
  trophy.add(foot);

  /* Lathed cup gives a true flared trophy silhouette. */
  const cupProfile=[
    new THREE.Vector2(.045,0),
    new THREE.Vector2(.075,.035),
    new THREE.Vector2(.105,.10),
    new THREE.Vector2(.145,.18),
    new THREE.Vector2(.165,.27),
    new THREE.Vector2(.17,.31)
  ];
  const cup=new THREE.Mesh(new THREE.LatheGeometry(cupProfile,40),gold);
  cup.position.y=.94;
  cup.castShadow=true;
  trophy.add(cup);

  const lip=new THREE.Mesh(new THREE.TorusGeometry(.17,.014,12,48),gold);
  lip.rotation.x=Math.PI/2;
  lip.position.y=1.25;
  trophy.add(lip);

  /* Curved handles */
  for(const side of [-1,1]){
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(side*.145,1.18,0),

  g.addColorStop(0,'#090909');

  ctx.fillStyle=g;

  ctx.strokeRect(12,12,1000,232);
  ctx.textAlign='center';

  ctx.font='900 74px Arial';
  ctx.fillText(text,512,112);
  ctx.fillStyle='#b9b9b9';
  ctx.font='700 28px Arial';
  ctx.letterSpacing='8px';
  ctx.fillText(subtext,512,174);
  return new THREE.CanvasTexture(canvas);
}

let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function gameTone(freq=220,duration=.08,gain=.035,type='sine'){
  ensureAudio();
  const osc=audioCtx.createOscillator();
  const amp=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
  amp.gain.setValueAtTime(gain,audioCtx.currentTime);
  amp.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
  osc.connect(amp).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function captureSound(){
  gameTone(110,.12,.045,'square');
  setTimeout(()=>gameTone(82,.10,.03,'triangle'),55);
}

          king:false
        };

  for(let r=5;r<8;r++)
    for(let c=0;c<8;c++)
      if((r+c)%2===1)
        state[r][c]={
          color:'red',
          king:false
        };

}

function clearBoard(){

  while(board.children.length)
    board.remove(board.children[0]);

  cells=[];
  pieces=[];

}

function squarePosition(r,c){

  return new THREE.Vector3(
    (c-3.5)*S,
    (3.5-r)*S,
    .045
  );

}

function createBoard(){

  clearBoard();

  /* FRAME */

  const frame=new THREE.Mesh(
    new THREE.BoxGeometry(
      S*8+.16,
      S*8+.16,
      .09
    ),
    new THREE.MeshStandardMaterial({
      color:0xb68a25,
      metalness:.75,
      roughness:.23
    })
  );

  frame.position.z=-.025;
  frame.castShadow=true;
  board.add(frame);


  /* SQUARES */

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const playable=(r+c)%2===1;

      const mat=new THREE.MeshStandardMaterial({
        color:playable ? 0x333333 : 0xe7d5a5,
        roughness:.42,
        metalness:playable ? .2 : .05
      });

      const sq=new THREE.Mesh(
        new THREE.BoxGeometry(
          S-.006,
          S-.006,
          .045
        ),
        mat
      );

      sq.position.copy(
        squarePosition(r,c)
      );

      sq.userData={
        type:'square',
        row:r,
        col:c,
        playable
      };

      sq.castShadow=true;
      sq.receiveShadow=true;

      board.add(sq);
      cells.push(sq);

    }

  }


  /* PIECES */

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const data=state[r][c];

      if(!data) continue;

      createPiece(
        r,
        c,
        data
      );

    }

  }

}


/* =========================================
   KING PROMOTION CELEBRATION
========================================= */

function kingCelebration(row,col){

  kingSound();

  const center=squarePosition(row,col);
  center.z=.12;

  /* Strong haptic pulse */

  pulseHaptics();

  setTimeout(
    ()=>pulseHaptics(),
    140
  );

  /* Gold point light */

  const light=new THREE.PointLight(
    0xffd34d,
    10,
    3.2
  );

  light.position.copy(center);
  light.position.z=.35;

  board.add(light);

  /* Expanding gold rings */

  const rings=[];

  for(let i=0;i<4;i++){

    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(
        .10,
        .012,
        12,
        40
      ),
      new THREE.MeshBasicMaterial({
        color:0xffd34d,
        transparent:true,
        opacity:.95
      })
    );

    ring.position.copy(center);
    ring.position.z=.13;

    ring.rotation.x=Math.PI/2;

    ring.userData.delay=i*100;

    board.add(ring);
    rings.push(ring);

  }

  /* Gold particle burst */

  const particles=[];

  for(let i=0;i<36;i++){

    const particle=new THREE.Mesh(
      new THREE.SphereGeometry(
        .012,
        5,
        5
      ),
      new THREE.MeshBasicMaterial({
        color:0xffd34d
      })
    );

    particle.position.copy(center);

    particle.position.x+=
      (Math.random()-.5)*.12;

    particle.position.y+=
      (Math.random()-.5)*.12;

    particle.position.z+=
      Math.random()*.04;

    particle.userData.velocity={
      x:(Math.random()-.5)*.004,
      y:(Math.random()*.006)+.002,
      z:(Math.random()-.5)*.004
    };

    board.add(particle);
    particles.push(particle);

  }

  /* Floating KING text */

  const canvas=document.createElement('canvas');

  canvas.width=512;
  canvas.height=128;

  const ctx=canvas.getContext('2d');

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.font=
    'bold 72px Arial';

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  ctx.strokeStyle='#000000';
  ctx.lineWidth=12;

  ctx.strokeText(
    'KING!',
    256,
    64
  );

  ctx.fillStyle='#ffd34d';

  ctx.fillText(
    'KING!',
    256,
    64
  );

  const texture=
    new THREE.CanvasTexture(canvas);

  const textMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(
      .95,
      .24
    ),
    new THREE.MeshBasicMaterial({
      map:texture,
      transparent:true,
      depthWrite:false
    })
  );

  textMesh.position.copy(center);
  textMesh.position.y+=.16;
  textMesh.position.z+=.18;

  board.add(textMesh);

  /* A large 3D gold crown rises and spins above the promoted checker. */
  const crownMat=new THREE.MeshPhysicalMaterial({
    color:0xffd34d,
    metalness:.9,
    roughness:.16,
    emissive:0x6b3d00,
    emissiveIntensity:.55
  });
  const celebrationCrown=new THREE.Group();
  const crownBand=new THREE.Mesh(
    new THREE.CylinderGeometry(.12,.12,.055,32),
    crownMat
  );
  const crownTop=new THREE.Mesh(
    new THREE.ConeGeometry(.15,.18,5),
    crownMat
  );
  crownTop.position.y=.10;
  celebrationCrown.add(crownBand,crownTop);
  celebrationCrown.position.copy(center);
  celebrationCrown.position.z+=.25;
  celebrationCrown.rotation.x=Math.PI/2;
  celebrationCrown.scale.setScalar(.1);
  board.add(celebrationCrown);

  const start=performance.now();
  const duration=2200;

  function animate(now){

    const t=Math.min(
      (now-start)/duration,
      1
    );

    const eased=
      1-Math.pow(1-t,3);

    /* Rings expand */

    rings.forEach((ring,i)=>{

      const local=Math.max(
        0,
        Math.min(
          1,
          (t*2200-ring.userData.delay)/900
        )
      );

      ring.scale.setScalar(
        1+local*4.2
      );

      ring.material.opacity=
        .95*(1-local);

    });

    /* Particles fly upward */

    particles.forEach(p=>{

      p.position.x+=
        p.userData.velocity.x;

      p.position.y+=
        p.userData.velocity.y;

      p.position.z+=
        p.userData.velocity.z;

      p.material.opacity=
        1-t;

    });

    /* KING text rises */

    textMesh.position.y=
      center.y+
      .16+
      eased*.60;

    textMesh.material.opacity=
      1-t;

    /* Crown rises, grows and spins above the new king. */
    const crownPop=Math.min(1,t*4);
    celebrationCrown.scale.setScalar(.1+crownPop*.9);
    celebrationCrown.position.z=center.z+.25+eased*.48;
    celebrationCrown.rotation.z=t*Math.PI*6;

    /* Light fades */
    light.intensity=
      10*(1-t);

    if(t<1){

      requestAnimationFrame(
        animate
      );

    }else{

      rings.forEach(r=>{
        board.remove(r);
        r.geometry.dispose();
        r.material.dispose();
      });

      particles.forEach(p=>{
        board.remove(p);
        p.geometry.dispose();
        p.material.dispose();
      });

      board.remove(light);

      light.dispose?.();

      board.remove(textMesh);

      board.remove(celebrationCrown);
      celebrationCrown.traverse(o=>{
        if(o.geometry) o.geometry.dispose();
      });
      crownMat.dispose();

      texture.dispose();

      textMesh.geometry.dispose();
      textMesh.material.dispose();

    }

  }

  requestAnimationFrame(
    animate
  );

}


function createPiece(r,c,data){

  /*
  Black pieces intentionally use charcoal
  instead of pure black so they remain
  visible on the dark squares.
  */

  const color=
    data.color==='red'
      ? 0xd91f26
      : 0x181818;

  const material=
    new THREE.MeshPhysicalMaterial({
      color,
      metalness:.25,
      roughness:.32,
      clearcoat:.8,
      clearcoatRoughness:.18,
      emissive:0x000000,
      emissiveIntensity:0
    });

  const piece=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .083,
        .083,
        .045,
        40
      ),
      material
    );

  piece.rotation.x=Math.PI/2;

  piece.position.copy(
    squarePosition(r,c)
  );

  piece.position.z=.085;

  piece.castShadow=true;

  piece.userData={
    type:'piece',
    row:r,
    col:c,
    color:data.color
  };


  /* GOLD RIM */

  const rim=new THREE.Mesh(
    new THREE.TorusGeometry(
      .068,
      .008,
      12,
      36
    ),
    new THREE.MeshStandardMaterial({
      color:0xffd34d,
      metalness:.9,
      roughness:.18
    })
  );

  rim.position.z=.026;
  piece.add(rim);


  /* KING MARKER */

  if(data.king){

    const crown=new THREE.Mesh(
      new THREE.TorusGeometry(
        .035,
        .009,
        10,
        30
      ),
      new THREE.MeshStandardMaterial({
        color:0xffd34d,
        metalness:1,
        roughness:.15
      })
    );

    crown.position.z=.03;
    piece.add(crown);

  }

  board.add(piece);
  pieces.push(piece);

}


/* HIGHLIGHTS */

function clearHighlights(){

  for(const cell of cells){

    if(cell.userData.playable)
      cell.material.color.set(0x333333);

  }

}

function highlightMoves(r,c){

  clearHighlights();

  const moves=legalMovesFor(r,c);

  for(const move of moves){

    highlightSquare(
      move.row,
      move.col,
      move.capture
        ? 0xff9f1c
        : 0x24c96b
    );
  }
}

function highlightSquare(r,c,color){

  const cell=cells.find(
    x=>
      x.userData.row===r &&
      x.userData.col===c
  );

  if(cell)
    cell.material.color.set(color);

}



/* COMPLETE GAME RULES */

function inside(r,c){
  return r>=0 && r<8 && c>=0 && c<8;
}

function directionsFor(piece){

  if(piece.king)
    return [[-1,-1],[-1,1],[1,-1],[1,1]];

  return piece.color==='red'
    ? [[-1,-1],[-1,1]]
    : [[1,-1],[1,1]];
}

function capturesFor(r,c){

  const piece=state[r][c];
  if(!piece) return [];

  const moves=[];

  for(const [dr,dc] of directionsFor(piece)){

    const mr=r+dr;
    const mc=c+dc;
    const nr=r+dr*2;
    const nc=c+dc*2;

    if(
      inside(nr,nc) &&
      inside(mr,mc) &&
      state[mr][mc] &&
      state[mr][mc].color!==piece.color &&
      !state[nr][nc]
    ){
      moves.push({
        row:nr,
        col:nc,
        capture:{row:mr,col:mc}
      });
    }
  }

  return moves;
}

function normalMovesFor(r,c){

  const piece=state[r][c];
  if(!piece) return [];

  const moves=[];

  for(const [dr,dc] of directionsFor(piece)){

    const nr=r+dr;
    const nc=c+dc;

    if(
      inside(nr,nc) &&
      !state[nr][nc]
    ){
      moves.push({
        row:nr,
        col:nc,
        capture:null
      });
    }
  }

  return moves;
}

function playerHasCapture(color){

  for(let r=0;r<8;r++)
    for(let c=0;c<8;c++)
      if(
        state[r][c] &&
        state[r][c].color===color &&
        capturesFor(r,c).length
      )
        return true;

  return false;
}

function legalMovesFor(r,c){

  const piece=state[r][c];

  if(!piece || piece.color!==turn)
    return [];

  /* Player-choice rules: any piece may make any legal diagonal move.
     A capture is available as a choice, but the game does not force the
     player to abandon the move they selected just because another capture exists. */
  const captures=capturesFor(r,c);

  return [
    ...captures,
    ...normalMovesFor(r,c)
  ];
}

function updateScore(){

  let red=0;
  let black=0;
  let redKings=0;
  let blackKings=0;

  for(const row of state){

    for(const piece of row){

      if(!piece)
        continue;

      if(piece.color==='red'){

        red++;

        if(piece.king)
          redKings++;

      }else{

        black++;

        if(piece.king)
          blackKings++;

      }

    }

  }

  const redScore=
    document.getElementById('redScore');

  const blackScore=
    document.getElementById('blackScore');

  const redCaptures=
    document.getElementById('redCaptures');

  const blackCaptures=
    document.getElementById('blackCaptures');

  const redKing=
    document.getElementById('redKings');

  const blackKing=
    document.getElementById('blackKings');

  if(redScore)
    redScore.textContent=red;

  if(blackScore)
    blackScore.textContent=black;

  if(redCaptures)
    redCaptures.textContent=12-black;

  if(blackCaptures)
    blackCaptures.textContent=12-red;

  if(redKing)
    redKing.textContent=redKings;

  if(blackKing)
    blackKing.textContent=blackKings;

  /* Keep the physical VR scoreboard synchronized with the match. */
  drawWorldScoreboard(red,black,redKings,blackKings);

}

function hasAnyMove(color){

  const oldTurn=turn;
  turn=color;

  let found=false;

  for(let r=0;r<8 && !found;r++)
    for(let c=0;c<8;c++)
      if(
        state[r][c] &&
        state[r][c].color===color &&
        legalMovesFor(r,c).length
      ){
        found=true;
        break;
      }

  turn=oldTurn;
  return found;
}

function checkWinner(){

  let red=0;
  let black=0;

  for(const row of state)
    for(const piece of row)
      if(piece){
        if(piece.color==='red') red++;
        else black++;
      }

  let winner=null;

  if(red===0) winner='Black';
  else if(black===0) winner='Red';
  else if(!hasAnyMove(turn))
    winner=turn==='red' ? 'Black' : 'Red';

  if(winner){

    gameOver=true;

    document.getElementById(
      'status'
    ).textContent=
      winner+' Wins! 🏆';

    /* One cumulative database update per completed game, never a duplicate player row. */
    if(gameMode==='ai'){
      reportLeaderboardResult(winner==='Red' ? 'win' : 'loss');
    } else if(gameMode==='online' && onlineColor){
      const myWinner=onlineColor==='red' ? 'Red' : 'Black';
      reportLeaderboardResult(winner===myWinner ? 'win' : 'loss');
    }

  }
}

function pulseHaptics(){

  if(!renderer.xr.isPresenting)
    return;

  const controllers=[
    renderer.xr.getController(0),
    renderer.xr.getController(1)
  ];

  for(const ctrl of controllers){

    const source=
      ctrl.userData.inputSource;

    if(!source || !source.gamepad)
      continue;

    const gamepad=source.gamepad;

    try{

      if(
        gamepad.hapticActuators &&
        gamepad.hapticActuators.length
      ){

        gamepad.hapticActuators[0].pulse(
          0.8,
          120
        );

      }

      else if(
        gamepad.vibrationActuator
      ){

        gamepad.vibrationActuator.playEffect(
          'dual-rumble',
          {
            startDelay:0,
            duration:120,
            weakMagnitude:0.8,
            strongMagnitude:0.8
          }
        );

      }

    }catch(error){

      console.log(
        'Haptic error:',
        error
      );

    }

  }
}


/* MOVEMENT */

function attemptMove(r,c){

  if(!selected || gameOver)
    return;

  const sr=selected.row;
  const sc=selected.col;

  const piece=state[sr][sc];

  if(!piece)
    return;

  const legal=
    legalMovesFor(sr,sc);

  const move=
    legal.find(
      m=>m.row===r && m.col===c
    );

  if(!move)
    return;

  state[r][c]=piece;
  state[sr][sc]=null;

  moveSound();

  if(move.capture){

    state[
      move.capture.row
    ][
      move.capture.col
    ]=null;

    pulseHaptics();
    captureSound();
  }

  /* KING PROMOTION */

  const becameKing =
    !piece.king &&
    (
      (piece.color==='red' && r===0) ||
      (piece.color==='black' && r===7)
    );

  if(
    piece.color==='red' &&
    r===0
  ){
    piece.king=true;
  }

  if(
    piece.color==='black' &&
    r===7
  ){
    piece.king=true;
  }

  if(becameKing){

    document.getElementById(
      'status'
    ).textContent=
      capitalize(piece.color)+
      ' crowned KING!';

  }

  /* A capture completes the player's chosen move.
     Additional jumps are available on a later turn instead of being forced. */
  forcedPiece=null;
  selected=null;

  if(selectedPieceMesh){
    selectedPieceMesh.scale.set(1,1,1);

    if(
      selectedPieceMesh.material &&
      selectedPieceMesh.material.emissive
    ){
      selectedPieceMesh.material.emissive.setHex(0x000000);
    }

    selectedPieceMesh=null;
  }

  turn=
    turn==='red'
      ? 'black'
      : 'red';

  createBoard();
  updateScore();

  /* Run promotion effects AFTER createBoard().
     createBoard clears the board group, so starting the animation before
     rebuilding made the KING celebration disappear immediately. */
  if(becameKing){
    kingCelebration(r,c);
  }

  document.getElementById(
    'status'
  ).textContent=
    capitalize(turn)+"'s Turn";

  checkWinner();
  sendOnlineState();

  if(
    !gameOver &&
    gameMode==='ai' &&
    turn==='black'
  ){
    startAI();
  }
}

function capitalize(s){

  return s.charAt(0).toUpperCase()+
         s.slice(1);

}



/* =========================================
   BRADLEY CHECKERS AI
========================================= */

function allLegalMoves(color){

  const oldTurn=turn;
  turn=color;

  const moves=[];

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const piece=state[r][c];

      if(!piece || piece.color!==color)
        continue;

      /* Use the same player-choice rules as the human player.
         Previously the AI still forced captures globally while humans did not.
         That rule mismatch could make late-game AI behavior appear frozen. */
      const list=legalMovesFor(r,c);

      for(const move of list){

        moves.push({
          from:{row:r,col:c},
          to:{
            row:move.row,
            col:move.col
          },
          capture:move.capture
        });

      }

    }

  }

  turn=oldTurn;

  return moves;
}


function scoreAIMove(move){

  let score=Math.random()*2;

  const piece=
    state[
      move.from.row
    ][
      move.from.col
    ];

  /* Captures are valuable */

  if(move.capture)
    score+=25;

  /* Prefer promotion */

  if(
    piece &&
    !piece.king &&
    (
      (
        piece.color==='black' &&
        move.to.row===7
      ) ||
      (
        piece.color==='red' &&
        move.to.row===0
      )
    )
  ){
    score+=35;
  }

  /* Prefer center control */

  if(
    move.to.col>=2 &&
    move.to.col<=5
  ){
    score+=5;
  }

  /* Kings are strategically valuable */

  if(piece?.king)
    score+=7;

  /* Edge squares are safer */

  if(
    move.to.col===0 ||
    move.to.col===7
  ){
    score+=3;
  }

  return score;
}


function chooseAIMove(){

  const moves=
    allLegalMoves('black');

  if(!moves.length)
    return null;


  /* EASY = mostly random */

  if(aiDifficulty==='easy'){

    return moves[
      Math.floor(
        Math.random()*moves.length
      )
    ];

  }


  /* MEDIUM */

  if(aiDifficulty==='medium'){

    const captures=
      moves.filter(
        m=>m.capture
      );

    if(
      captures.length &&
      Math.random()>.25
    ){

      return captures[
        Math.floor(
          Math.random()*
          captures.length
        )
      ];

    }

    return moves[
      Math.floor(
        Math.random()*moves.length
      )
    ];

  }


  /* HARD / EXPERT */

  const ranked=
    moves
      .map(m=>({
        move:m,
        score:scoreAIMove(m)
      }))
      .sort(
        (a,b)=>b.score-a.score
      );


  if(aiDifficulty==='hard'){

    const top=
      ranked.slice(
        0,
        Math.min(3,ranked.length)
      );

    return top[
      Math.floor(
        Math.random()*top.length
      )
    ].move;

  }


  /* EXPERT */

  return ranked[0].move;
}


function performAIMove(move){

  if(!move || gameOver)
    return;

  selected={
    row:move.from.row,
    col:move.from.col
  };

  attemptMove(
    move.to.row,
    move.to.col
  );

  /* Captures and additional jumps are optional in Bradley Checkers.
     attemptMove completes one AI move and changes the turn. */
  finishAI();
}


function finishAI(){

  aiThinking=false;

  if(!gameOver){

    document.getElementById(
      'status'
    ).textContent=
      capitalize(turn)+"'s Turn";

  }

}


function startAI(){

  if(
    gameMode!=='ai' ||
    turn!=='black' ||
    gameOver ||
    aiThinking
  ){
    return;
  }

  aiThinking=true;

  document.getElementById(
    'status'
  ).textContent=
    'Black AI is thinking...';

  setTimeout(
    ()=>{

      const move=
        chooseAIMove();

      if(!move){

        aiThinking=false;
        checkWinner();
        return;

      }

      performAIMove(move);

    },
    650
  );
}


/* SELECTION */

function handleObject(obj){

  if(!obj || aiThinking) return;

  if(
    gameMode==='ai' &&
    turn==='black'
  ) return;

  const data=obj.userData;

  if(data.type==='casualStation'){ chooseCasualStation(data.station); return; }

  if(data.type==='invitePlayerRow'){
    const name=invitePlayers[data.index];
    if(name) sendPlayerInvite(name);
    return;
  }
  if(data.type==='acceptInvite'){
    if(pendingInvite) respondToInvite('accept');
    return;
  }
  if(data.type==='declineInvite'){
    if(pendingInvite) respondToInvite('decline');
    return;
  }

  /* In an online match, each device can move only its assigned color. */
  if(gameMode==='online' && (!onlineConnection || !onlineConnection.open || turn!==onlineColor)) return;

  if(data.type==='piece'){

    const p=
      state[data.row][data.col];

    if(
      p &&
      p.color===turn &&
      !gameOver
    ){

      if(
        forcedPiece &&
        (
          forcedPiece.row!==data.row ||
          forcedPiece.col!==data.col
        )
      ) return;

      if(selectedPieceMesh){

        selectedPieceMesh.scale.set(1,1,1);

        if(
          selectedPieceMesh.material &&
          selectedPieceMesh.material.emissive
        ){
          selectedPieceMesh.material.emissive.setHex(0x000000);
          selectedPieceMesh.material.emissiveIntensity=0;
        }

        if(
          selectedPieceMesh.userData.selectionColor !== undefined &&
          selectedPieceMesh.material &&
          selectedPieceMesh.material.color
        ){
          selectedPieceMesh.material.color.setHex(
            selectedPieceMesh.userData.selectionColor
          );
        }

        selectedPieceMesh=null;
      }

      selected={
        row:data.row,
        col:data.col
      };

      selectedPieceMesh=obj;

      /* Physical pickup feedback: selected checker lifts toward the player. */
      obj.scale.set(1.12,1.12,1.12);
      obj.position.z+=.035;
      pulseHaptics();
      gameTone(245,.045,.018,'sine');

      if(obj.material){

        if(obj.material.emissive){
          obj.material.emissive.setHex(0xffc400);
          obj.material.emissiveIntensity=1.4;
        }

        if(obj.material.color){
          obj.userData.selectionColor=
            obj.material.color.getHex();

          obj.material.color.setHex(
            0xffc400
          );
        }
      }

      highlightMoves(
        data.row,
        data.col
      );

    }

    return;

  }

  if(
    data.type==='square' &&
    data.playable
  ){

    attemptMove(
      data.row,
      data.col
    );

  }

}


/* DESKTOP CLICK */

window.addEventListener(
  'pointerdown',
  e=>{

    const mouse=
      new THREE.Vector2(
        e.clientX/innerWidth*2-1,
        -(e.clientY/innerHeight)*2+1
      );

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits=
      raycaster.intersectObjects(
        [...stationHitTargets,...inviteHitTargets,...pieces,...cells],
        false
      );

    if(hits.length)
      handleObject(
        hits[0].object
      );

  }
);


/* VR CONTROLLERS */

function controller(index){

  const ctrl=
    renderer.xr.getController(index);

  ctrl.addEventListener(
    'connected',
    event=>{
      ctrl.userData.inputSource=event.data;
    }
  );

  const line=
    new THREE.Line(
      new THREE.BufferGeometry()
        .setFromPoints([
          new THREE.Vector3(0,0,0),
          new THREE.Vector3(0,0,-5)
        ]),
      new THREE.LineBasicMaterial({
        color:0xffdd66
      })
    );

  ctrl.add(line);

  ctrl.addEventListener(
    'selectstart',
    ()=>{
      pulseHaptics();

      tempMatrix
        .identity()
        .extractRotation(
          ctrl.matrixWorld
        );

      raycaster.ray.origin
        .setFromMatrixPosition(
          ctrl.matrixWorld
        );

      raycaster.ray.direction
        .set(0,0,-1)
        .applyMatrix4(
          tempMatrix
        );

      const hits=
        raycaster.intersectObjects(
          [...stationHitTargets,...inviteHitTargets,...pieces,...cells],
          false
        );

      if(hits.length)
        handleObject(
          hits[0].object
        );

    }
  );

  playerRig.add(ctrl);

}

controller(0);
controller(1);

/* QUEST LOCOMOTION: left stick moves relative to headset; right stick snap-turns. */
let snapReady=true;
const moveSpeed=1.65;
const snapAngle=THREE.MathUtils.degToRad(30);
const vrClock=new THREE.Clock();

/* DESKTOP WALK MODE: WASD / arrow keys move through the full club; Q/E turn. */
const desktopKeys=new Set();
const desktopClock=new THREE.Clock();
window.addEventListener('keydown',e=>{
  const tag=(e.target?.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){
    desktopKeys.add(e.code); e.preventDefault();
  }
});
window.addEventListener('keyup',e=>desktopKeys.delete(e.code));
window.addEventListener('blur',()=>desktopKeys.clear());

function updateDesktopLocomotion(){
  if(renderer.xr.isPresenting){ desktopClock.getDelta(); return; }
  const dt=Math.min(desktopClock.getDelta(),.05);
  const forward=new THREE.Vector3(); camera.getWorldDirection(forward); forward.y=0; forward.normalize();
  const right=new THREE.Vector3(-forward.z,0,forward.x).normalize();
  let f=0,r=0;
  if(desktopKeys.has('KeyW')||desktopKeys.has('ArrowUp')) f+=1;
  if(desktopKeys.has('KeyS')||desktopKeys.has('ArrowDown')) f-=1;
  if(desktopKeys.has('KeyD')||desktopKeys.has('ArrowRight')) r+=1;
  if(desktopKeys.has('KeyA')||desktopKeys.has('ArrowLeft')) r-=1;
  if(f||r){
    const move=new THREE.Vector3().addScaledVector(forward,f).addScaledVector(right,r).normalize();
    playerRig.position.addScaledVector(move,3.0*dt);
    playerRig.position.x=THREE.MathUtils.clamp(playerRig.position.x,-4.25,4.25);
    playerRig.position.z=THREE.MathUtils.clamp(playerRig.position.z,-.05,17.35);
  }
  const turn=(desktopKeys.has('KeyQ')?1:0)-(desktopKeys.has('KeyE')?1:0);
  if(turn) playerRig.rotation.y+=turn*1.65*dt;
}

function updateVRLocomotion(){
  if(!renderer.xr.isPresenting) return;

  const session=renderer.xr.getSession();
  if(!session) return;

  let leftSource=null;
  let rightSource=null;
  for(const source of session.inputSources){
    if(!source.gamepad) continue;
    if(source.handedness==='left') leftSource=source;
    if(source.handedness==='right') rightSource=source;
  }

  const dt=Math.min(vrClock.getDelta(),.05);

  if(leftSource){
    const axes=leftSource.gamepad.axes;
    const x=axes.length>=4 ? axes[2] : axes[0];
    const y=axes.length>=4 ? axes[3] : axes[1];

    if(Math.abs(x)>.16 || Math.abs(y)>.16){
      /* Quest locomotion must follow the headset's WORLD direction.
         xrCamera.quaternion can be local to playerRig after snap-turning,
         which makes movement feel reversed/rotated. getWorldQuaternion keeps
         forward = where the player is looking and right = headset right. */
      const xrCamera=renderer.xr.getCamera(camera);
      const headWorldQ=new THREE.Quaternion();
      xrCamera.getWorldQuaternion(headWorldQ);

      const forward=new THREE.Vector3(0,0,-1).applyQuaternion(headWorldQ);
      forward.y=0;
      forward.normalize();

      /* Derive right from forward on the floor plane so left/right cannot flip. */
      const right=new THREE.Vector3(forward.z,0,-forward.x).normalize();

      /* Quest stick: up follows headset forward; right follows headset right. */
      playerRig.position.addScaledVector(right,x*moveSpeed*dt);
      playerRig.position.addScaledVector(forward,-y*moveSpeed*dt);
    }
  }

  if(rightSource){
    const axes=rightSource.gamepad.axes;
    const turnX=axes.length>=4 ? axes[2] : axes[0];

    if(Math.abs(turnX)>.72 && snapReady){
      playerRig.rotation.y+=Math.sign(turnX)*snapAngle;
      snapReady=false;
      pulseHaptics();
    }
    if(Math.abs(turnX)<.25) snapReady=true;
  }
}


/* RESET */

document
.getElementById('restart')
.addEventListener(
  'click',
  ()=>{

    turn='red';
    selected=null;
    forcedPiece=null;
    gameOver=false; leaderboardResultReported=false;
    redCaptured=0;
    blackCaptured=0;

    resetState();
    createBoard();
    updateScore();

    document.getElementById(
      'status'
    ).textContent="Red's Turn";

  }
);


/* WALL / TABLE MODE */

document
.getElementById('mode')
.addEventListener(
  'click',
  ()=>{

    tableMode=!tableMode;

    if(tableMode){

      board.rotation.x=
        -Math.PI/2;

      board.position.set(
        0,
        .82,
        -.35
      );

    }else{

      board.rotation.x=0;

      board.position.set(
        0,
        1.6,
        0
      );

    }

  }
);



/* GAME MODE */

document
.getElementById('gameMode')
.addEventListener(
  'click',
  ()=>{

    if(aiThinking)
      return;

    gameMode=
      gameMode==='ai'
        ? 'human'
        : 'ai';

    document.getElementById(
      'gameMode'
    ).textContent=
      gameMode==='ai'
        ? 'Human vs AI'
        : 'Human vs Human';

    turn='red';
    selected=null;
    forcedPiece=null;
    gameOver=false;
    aiThinking=false;

    resetState();
    createBoard();
    updateScore();

    document.getElementById(
      'status'
    ).textContent=
      "Red's Turn";

  }
);


/* AI DIFFICULTY */

const difficultyOrder=[
  'easy',
  'medium',
  'hard',
  'expert'
];

document
.getElementById('difficulty')
.addEventListener(
  'click',
  ()=>{

    let i=
      difficultyOrder.indexOf(
        aiDifficulty
      );

    i=
      (i+1)%
      difficultyOrder.length;

    aiDifficulty=
      difficultyOrder[i];

    document.getElementById(
      'difficulty'
    ).textContent=
      'AI: '+
      capitalize(
        aiDifficulty
      );

  }
);


/* INITIAL */

resetState();

board.position.set(
  0,
  1.6,
  0
);

createBoard();
updateScore();


window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


renderer.setAnimationLoop(
  ()=>{

    updateVRLocomotion();
    updateDesktopLocomotion();

    renderer.render(
      scene,
      camera
    );

  }
);
