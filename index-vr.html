<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bradley WebXR Checkers</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,sans-serif;
}
#hud{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  width:min(520px,92vw);
  color:white;
  text-align:center;
  background:linear-gradient(180deg,rgba(18,18,18,.96),rgba(3,3,3,.90));
  padding:10px 14px 9px;
  border:1px solid #c9a227;
  border-radius:14px;
  box-shadow:0 10px 32px rgba(0,0,0,.5),inset 0 0 18px rgba(201,162,39,.08);
  pointer-events:none;
  box-sizing:border-box;
}
#title{
  color:#ffd95a;
  font-weight:900;
  font-size:18px;
  letter-spacing:1.4px;
}
#matchLabel{
  margin-top:1px;
  color:#9e9e9e;
  font-size:9px;
  letter-spacing:2.4px;
}
#players{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  margin-top:7px;
}
.playerPanel{
  display:grid;
  grid-template-columns:auto 34px;
  grid-template-rows:auto auto;
  align-items:center;
  column-gap:9px;
  padding:6px 10px;
  border-radius:9px;
  background:rgba(255,255,255,.035);
}
.redPanel{border:1px solid rgba(217,31,38,.65)}
.blackPanel{border:1px solid rgba(220,220,220,.32)}
.playerName{
  text-align:left;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.6px;
}
.playerScore{
  grid-row:1 / 3;
  grid-column:2;
  font-size:26px;
  line-height:1;
  font-weight:900;
}
.redPanel .playerScore{color:#ff4048}
.blackPanel .playerScore{color:#f2f2f2}
.playerStats{
  display:flex;
  gap:9px;
  margin-top:3px;
  color:#8f8f8f;
  font-size:8px;
  white-space:nowrap;
}
.playerStats b{color:#ffd95a}
.vs{
  color:#ffd95a;
  font-size:10px;
  font-weight:900;
}
#status{
  display:inline-block;
  margin-top:7px;
  padding:3px 12px;
  border-radius:999px;
  background:rgba(201,162,39,.10);
  color:#fff1ae;
  font-size:11px;
  font-weight:800;
  letter-spacing:.8px;
}

#controls{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  gap:8px;
}
button{
  padding:10px 14px;
  border:1px solid #c9a227;
  border-radius:9px;
  background:#151515;
  color:white;
  cursor:pointer;
}
button:hover{background:#292929}
</style>

/*
PLAYER RIG

The Quest controls the camera's head movement.
The rig controls where the player stands in the world.

Board = Z 0
Player rig = Z +3.5
*/

camera.lookAt(0,0.85,0);

/* DESKTOP CAMERA / QUEST CAMERA */

function updateDesktopCamera(){

  if(renderer.xr.isPresenting)
    return;

  /* Desktop view must not inherit
     the VR player's 3.5m offset. */

  playerRig.position.set(
    0,
    0,
    0
  );

  camera.position.set(
    0,
    2.9,
    5.8
  );

  camera.lookAt(
    0,
    0.85,
    0
  );

}

/* Restore the VR player distance when entering VR. */

  'sessionstart',
  ()=>{
    playerRig.position.set(
      0,
      0,
      3.5
    );
  }
);

renderer.xr.addEventListener(
  'sessionend',
  ()=>{
    updateDesktopCamera();
  }
);

  'resize',
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(

/* CHAMPIONSHIP BRANDING */

function makeSignTexture(text,subtext){
  const canvas=document.createElement('canvas');
  canvas.width=1024;
  canvas.height=256;
  const ctx=canvas.getContext('2d');
  const g=ctx.createLinearGradient(0,0,1024,256);
  g.addColorStop(0,'#090909');
  g.addColorStop(.5,'#18130a');
  g.addColorStop(1,'#090909');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,1024,256);
  ctx.strokeStyle='#c9a227';
  ctx.lineWidth=10;
  ctx.strokeRect(12,12,1000,232);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd95a';
  ctx.font='900 74px Arial';
  ctx.fillText(text,512,112);
  ctx.fillStyle='#b9b9b9';
  ctx.font='700 28px Arial';
  ctx.letterSpacing='8px';
  ctx.fillText(subtext,512,174);
  return new THREE.CanvasTexture(canvas);
}

/* Spatial-style game audio generated locally with Web Audio. */
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function gameTone(freq=220,duration=.08,gain=.035,type='sine'){
  ensureAudio();
  const osc=audioCtx.createOscillator();
  const amp=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,audioCtx.currentTime);
  amp.gain.setValueAtTime(gain,audioCtx.currentTime);
  amp.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
  osc.connect(amp).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}
function moveSound(){ gameTone(165,.055,.025,'triangle'); }
function captureSound(){
  gameTone(110,.12,.045,'square');
  setTimeout(()=>gameTone(82,.10,.03,'triangle'),55);
}
function kingSound(){
  [330,440,554,660].forEach((f,i)=>
    setTimeout(()=>gameTone(f,.22,.035,'sine'),i*85)
  );
}

function resetState(){

  state=Array.from(
    {length:8},
    ()=>Array(8).fill(null)
  );

  for(let r=0;r<3;r++)
    for(let c=0;c<8;c++)
      if((r+c)%2===1)
        state[r][c]={
          color:'black',
          king:false
        };

  for(let r=5;r<8;r++)
    for(let c=0;c<8;c++)
      if((r+c)%2===1)
        state[r][c]={
          color:'red',
          king:false
        };

}

function clearBoard(){

  while(board.children.length)
    board.remove(board.children[0]);

  cells=[];
  pieces=[];

}

function squarePosition(r,c){

  return new THREE.Vector3(
    (c-3.5)*S,
    (3.5-r)*S,
    .045

}

  frame.castShadow=true;
  board.add(frame);


  /* SQUARES */

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const playable=(r+c)%2===1;

      const mat=new THREE.MeshStandardMaterial({
        color:playable ? 0x333333 : 0xe7d5a5,
        roughness:.42,
        metalness:playable ? .2 : .05
      });

      const sq=new THREE.Mesh(
        new THREE.BoxGeometry(
          S-.006,
          S-.006,
          .045
        ),
        mat
      );

      sq.position.copy(
        squarePosition(r,c)
      );

      sq.userData={
        type:'square',
        row:r,
        col:c,
        playable
      };

      sq.castShadow=true;
      sq.receiveShadow=true;

      board.add(sq);
      cells.push(sq);

    }

  }


  /* PIECES */

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const data=state[r][c];

      if(!data) continue;

      createPiece(
        r,
        c,
        data
      );

    }

  }

}


/* =========================================
   KING PROMOTION CELEBRATION
========================================= */

function kingCelebration(row,col){

  kingSound();

  const center=squarePosition(row,col);
  center.z=.12;

  /* Strong haptic pulse */

  pulseHaptics();

  setTimeout(
    ()=>pulseHaptics(),
    140
  );

  /* Gold point light */

  const light=new THREE.PointLight(
    0xffd34d,
    8,
    2.5
  );

  light.position.copy(center);
  light.position.z=.35;

  board.add(light);

  /* Expanding gold rings */

  const rings=[];

  for(let i=0;i<3;i++){

    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(
        .10,
        .012,
        12,
        40
      ),
      new THREE.MeshBasicMaterial({
        color:0xffd34d,
        transparent:true,
        opacity:.95
      })
    );

    ring.position.copy(center);
    ring.position.z=.13;

    ring.rotation.x=Math.PI/2;

    ring.userData.delay=i*100;

    board.add(ring);
    rings.push(ring);

  }

  /* Gold particle burst */

  const particles=[];

  for(let i=0;i<28;i++){

    const particle=new THREE.Mesh(
      new THREE.SphereGeometry(
        .012,
        8,
        8
      ),
      new THREE.MeshBasicMaterial({
        color:0xffd34d
      })
    );

    particle.position.copy(center);

    particle.position.x+=
      (Math.random()-.5)*.12;

    particle.position.y+=
      (Math.random()-.5)*.12;

    particle.position.z+=
      Math.random()*.04;

    particle.userData.velocity={
      x:(Math.random()-.5)*.004,
      y:(Math.random()*.006)+.002,
      z:(Math.random()-.5)*.004
    };

    board.add(particle);
    particles.push(particle);

  }

  /* Floating KING text */

  const canvas=document.createElement('canvas');

  canvas.width=512;
  canvas.height=128;

  const ctx=canvas.getContext('2d');

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.font=
    'bold 72px Arial';

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  ctx.strokeStyle='#000000';
  ctx.lineWidth=12;

  ctx.strokeText(
    'KING!',
    256,
    64
  );

  ctx.fillStyle='#ffd34d';

  ctx.fillText(
    'KING!',
    256,
    64
  );

  const texture=
    new THREE.CanvasTexture(canvas);

  const textMesh=new THREE.Mesh(
    new THREE.PlaneGeometry(
      .65,
      .16
    ),
    new THREE.MeshBasicMaterial({
      map:texture,
      transparent:true,
      depthWrite:false
    })
  );

  textMesh.position.copy(center);
  textMesh.position.y+=.16;
  textMesh.position.z+=.18;

  board.add(textMesh);

  const start=performance.now();
  const duration=1300;

  function animate(now){

    const t=Math.min(
      (now-start)/duration,
      1
    );

    const eased=
      1-Math.pow(1-t,3);

    /* Rings expand */

    rings.forEach((ring,i)=>{

      const local=Math.max(
        0,
        Math.min(
          1,
          (t*1300-ring.userData.delay)/700
        )
      );

      ring.scale.setScalar(
        1+local*3
      );

      ring.material.opacity=
        .95*(1-local);

    });

    /* Particles fly upward */

    particles.forEach(p=>{

      p.position.x+=
        p.userData.velocity.x;

      p.position.y+=
        p.userData.velocity.y;

      p.position.z+=
        p.userData.velocity.z;

      p.material.opacity=
        1-t;

    });

    /* KING text rises */

    textMesh.position.y=
      center.y+
      .16+
      eased*.45;

    textMesh.material.opacity=
      1-t;

    /* Light fades */

    light.intensity=
      8*(1-t);

    if(t<1){

      requestAnimationFrame(
        animate
      );

    }else{

      rings.forEach(r=>{
        board.remove(r);
        r.geometry.dispose();
        r.material.dispose();
      });

      particles.forEach(p=>{
        board.remove(p);
        p.geometry.dispose();
        p.material.dispose();
      });

      board.remove(light);

      light.dispose?.();

      board.remove(textMesh);

      texture.dispose();

      textMesh.geometry.dispose();
      textMesh.material.dispose();

    }

  }

  requestAnimationFrame(
    animate
  );

}


function createPiece(r,c,data){

  /*
  Black pieces intentionally use charcoal
  instead of pure black so they remain
  visible on the dark squares.
  */

  const color=
    data.color==='red'
      ? 0xd91f26
      : 0x181818;

  const material=
    new THREE.MeshPhysicalMaterial({
      color,
      metalness:.25,
      roughness:.32,
      clearcoat:.8,
      clearcoatRoughness:.18,
      emissive:0x000000,
      emissiveIntensity:0
    });

  const piece=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .083,
        .083,
        .045,
        40
      ),
      material
    );

  piece.rotation.x=Math.PI/2;

  piece.position.copy(
    squarePosition(r,c)
  );

  piece.position.z=.085;

  piece.castShadow=true;

  piece.userData={
    type:'piece',
    row:r,
    col:c,
    color:data.color
  };


  /* GOLD RIM */

  const rim=new THREE.Mesh(
    new THREE.TorusGeometry(
      .068,
      .008,
      12,
      36
    ),
    new THREE.MeshStandardMaterial({
      color:0xffd34d,
      metalness:.9,
      roughness:.18
    })
  );

  rim.position.z=.026;
  piece.add(rim);


  /* KING MARKER */

  if(data.king){

    const crown=new THREE.Mesh(
      new THREE.TorusGeometry(
        .035,
        .009,
        10,
        30
      ),
      new THREE.MeshStandardMaterial({
        color:0xffd34d,
        metalness:1,
        roughness:.15
      })
    );

    crown.position.z=.03;
    piece.add(crown);

  }

  board.add(piece);
  pieces.push(piece);

}


/* HIGHLIGHTS */

function clearHighlights(){

  for(const cell of cells){

    if(cell.userData.playable)
      cell.material.color.set(0x333333);

  }

}

function highlightMoves(r,c){

  clearHighlights();

  const moves=legalMovesFor(r,c);

  for(const move of moves){

    highlightSquare(
      move.row,
      move.col,
      move.capture
        ? 0xff9f1c
        : 0x24c96b
    );
  }
}

function highlightSquare(r,c,color){

  const cell=cells.find(
    x=>
      x.userData.row===r &&
      x.userData.col===c
  );

  if(cell)
    cell.material.color.set(color);

}



/* COMPLETE GAME RULES */

function inside(r,c){
  return r>=0 && r<8 && c>=0 && c<8;
}

function directionsFor(piece){

  if(piece.king)
    return [[-1,-1],[-1,1],[1,-1],[1,1]];

  return piece.color==='red'
    ? [[-1,-1],[-1,1]]
    : [[1,-1],[1,1]];
}

function capturesFor(r,c){

  const piece=state[r][c];
  if(!piece) return [];

  const moves=[];

  for(const [dr,dc] of directionsFor(piece)){

    const mr=r+dr;
    const mc=c+dc;
    const nr=r+dr*2;
    const nc=c+dc*2;

    if(
      inside(nr,nc) &&
      inside(mr,mc) &&
      state[mr][mc] &&
      state[mr][mc].color!==piece.color &&
      !state[nr][nc]
    ){
      moves.push({
        row:nr,
        col:nc,
        capture:{row:mr,col:mc}
      });
    }
  }

  return moves;
}

function normalMovesFor(r,c){

  const piece=state[r][c];
  if(!piece) return [];

  const moves=[];

  for(const [dr,dc] of directionsFor(piece)){

    const nr=r+dr;
    const nc=c+dc;

    if(
      inside(nr,nc) &&
      !state[nr][nc]
    ){
      moves.push({
        row:nr,
        col:nc,
        capture:null
      });
    }
  }

  return moves;
}

function playerHasCapture(color){

  for(let r=0;r<8;r++)
    for(let c=0;c<8;c++)
      if(
        state[r][c] &&
        state[r][c].color===color &&
        capturesFor(r,c).length
      )
        return true;

  return false;
}

function legalMovesFor(r,c){

  const piece=state[r][c];

  if(!piece || piece.color!==turn)
    return [];

  const captures=capturesFor(r,c);

  if(playerHasCapture(turn))
    return captures;

  return [
    ...captures,
    ...normalMovesFor(r,c)
  ];
}

function updateScore(){

  let red=0;
  let black=0;
  let redKings=0;
  let blackKings=0;

  for(const row of state){

    for(const piece of row){

      if(!piece)
        continue;

      if(piece.color==='red'){

        red++;

        if(piece.king)
          redKings++;

      }else{

        black++;

        if(piece.king)
          blackKings++;

      }

    }

  }

  const redScore=
    document.getElementById('redScore');

  const blackScore=
    document.getElementById('blackScore');

  const redCaptures=
    document.getElementById('redCaptures');

  const blackCaptures=
    document.getElementById('blackCaptures');

  const redKing=
    document.getElementById('redKings');

  const blackKing=
    document.getElementById('blackKings');

  if(redScore)
    redScore.textContent=red;

  if(blackScore)
    blackScore.textContent=black;

  if(redCaptures)
    redCaptures.textContent=12-black;

  if(blackCaptures)
    blackCaptures.textContent=12-red;

  if(redKing)
    redKing.textContent=redKings;

  if(blackKing)
    blackKing.textContent=blackKings;

}

function hasAnyMove(color){

  const oldTurn=turn;
  turn=color;

  let found=false;

  for(let r=0;r<8 && !found;r++)
    for(let c=0;c<8;c++)
      if(
        state[r][c] &&
        state[r][c].color===color &&
        legalMovesFor(r,c).length
      ){
        found=true;
        break;
      }

  turn=oldTurn;
  return found;
}

function checkWinner(){

  let red=0;
  let black=0;

  for(const row of state)
    for(const piece of row)
      if(piece){
        if(piece.color==='red') red++;
        else black++;
      }

  let winner=null;

  if(red===0) winner='Black';
  else if(black===0) winner='Red';
  else if(!hasAnyMove(turn))
    winner=turn==='red' ? 'Black' : 'Red';

  if(winner){

    gameOver=true;

    document.getElementById(
      'status'
    ).textContent=
      winner+' Wins! 🏆';

  }
}

function pulseHaptics(){

  if(!renderer.xr.isPresenting)
    return;

  const controllers=[
    renderer.xr.getController(0),
    renderer.xr.getController(1)
  ];

  for(const ctrl of controllers){

    const source=
      ctrl.userData.inputSource;

    if(!source || !source.gamepad)
      continue;

    const gamepad=source.gamepad;

    try{

      if(
        gamepad.hapticActuators &&
        gamepad.hapticActuators.length
      ){

        gamepad.hapticActuators[0].pulse(
          0.8,
          120
        );

      }

      else if(
        gamepad.vibrationActuator
      ){

        gamepad.vibrationActuator.playEffect(
          'dual-rumble',
          {
            startDelay:0,
            duration:120,
            weakMagnitude:0.8,
            strongMagnitude:0.8
          }
        );

      }

    }catch(error){

      console.log(
        'Haptic error:',
        error
      );

    }

  }
}


/* MOVEMENT */

function attemptMove(r,c){

  if(!selected || gameOver)
    return;

  const sr=selected.row;
  const sc=selected.col;

  const piece=state[sr][sc];

  if(!piece)
    return;

  const legal=
    legalMovesFor(sr,sc);

  const move=
    legal.find(
      m=>m.row===r && m.col===c
    );

  if(!move)
    return;

  state[r][c]=piece;
  state[sr][sc]=null;

  moveSound();

  if(move.capture){

    state[
      move.capture.row
    ][
      move.capture.col
    ]=null;

    pulseHaptics();
    captureSound();
  }

  /* KING PROMOTION */

  const becameKing =
    !piece.king &&
    (
      (piece.color==='red' && r===0) ||
      (piece.color==='black' && r===7)
    );

  if(
    piece.color==='red' &&
    r===0
  ){
    piece.king=true;
  }

  if(
    piece.color==='black' &&
    r===7
  ){
    piece.king=true;
  }

  if(becameKing){

    kingCelebration(
      r,
      c
    );

    document.getElementById(
      'status'
    ).textContent=
      capitalize(piece.color)+
      ' crowned KING!';

  }

  /*
  MULTI-JUMP:
  after a capture, the same piece
  must continue if another capture exists.
  */

  if(move.capture){

    const more=
      capturesFor(r,c);

    if(more.length){

      selected={
        row:r,
        col:c
      };

      forcedPiece={
        row:r,
        col:c
      };

      createBoard();
      highlightMoves(r,c);
      updateScore();

      document.getElementById(
        'status'
      ).textContent=
        capitalize(turn)+
        ': Continue Jump';

      return;
    }
  }

  forcedPiece=null;
  selected=null;

  if(selectedPieceMesh){
    selectedPieceMesh.scale.set(1,1,1);

    if(
      selectedPieceMesh.material &&
      selectedPieceMesh.material.emissive
    ){
      selectedPieceMesh.material.emissive.setHex(0x000000);
    }

    selectedPieceMesh=null;
  }

  turn=
    turn==='red'
      ? 'black'
      : 'red';

  createBoard();
  updateScore();

  document.getElementById(
    'status'
  ).textContent=
    capitalize(turn)+"'s Turn";

  checkWinner();

  if(
    !gameOver &&
    gameMode==='ai' &&
    turn==='black'
  ){
    startAI();
  }
}

function capitalize(s){

  return s.charAt(0).toUpperCase()+
         s.slice(1);

}



/* =========================================
   BRADLEY CHECKERS AI
========================================= */

function allLegalMoves(color){

  const oldTurn=turn;
  turn=color;

  const moves=[];
  const mustCapture=playerHasCapture(color);

  for(let r=0;r<8;r++){

    for(let c=0;c<8;c++){

      const piece=state[r][c];

      if(!piece || piece.color!==color)
        continue;

      const list=
        mustCapture
          ? capturesFor(r,c)
          : legalMovesFor(r,c);

      for(const move of list){

        moves.push({
          from:{row:r,col:c},
          to:{
            row:move.row,
            col:move.col
          },
          capture:move.capture
        });

      }

    }

  }

  turn=oldTurn;

  return moves;
}


function scoreAIMove(move){

  let score=Math.random()*2;

  const piece=
    state[
      move.from.row
    ][
      move.from.col
    ];

  /* Captures are valuable */

  if(move.capture)
    score+=25;

  /* Prefer promotion */

  if(
    piece &&
    !piece.king &&
    (
      (
        piece.color==='black' &&
        move.to.row===7
      ) ||
      (
        piece.color==='red' &&
        move.to.row===0
      )
    )
  ){
    score+=35;
  }

  /* Prefer center control */

  if(
    move.to.col>=2 &&
    move.to.col<=5
  ){
    score+=5;
  }

  /* Kings are strategically valuable */

  if(piece?.king)
    score+=7;

  /* Edge squares are safer */

  if(
    move.to.col===0 ||
    move.to.col===7
  ){
    score+=3;
  }

  return score;
}


function chooseAIMove(){

  const moves=
    allLegalMoves('black');

  if(!moves.length)
    return null;


  /* EASY = mostly random */

  if(aiDifficulty==='easy'){

    return moves[
      Math.floor(
        Math.random()*moves.length
      )
    ];

  }


  /* MEDIUM */

  if(aiDifficulty==='medium'){

    const captures=
      moves.filter(
        m=>m.capture
      );

    if(
      captures.length &&
      Math.random()>.25
    ){

      return captures[
        Math.floor(
          Math.random()*
          captures.length
        )
      ];

    }

    return moves[
      Math.floor(
        Math.random()*moves.length
      )
    ];

  }


  /* HARD / EXPERT */

  const ranked=
    moves
      .map(m=>({
        move:m,
        score:scoreAIMove(m)
      }))
      .sort(
        (a,b)=>b.score-a.score
      );


  if(aiDifficulty==='hard'){

    const top=
      ranked.slice(
        0,
        Math.min(3,ranked.length)
      );

    return top[
      Math.floor(
        Math.random()*top.length
      )
    ].move;

  }


  /* EXPERT */

  return ranked[0].move;
}


function performAIMove(move){

  if(!move || gameOver)
    return;

  selected={
    row:move.from.row,
    col:move.from.col
  };

  attemptMove(
    move.to.row,
    move.to.col
  );


  /*
  attemptMove keeps turn on Black
  during mandatory multi-jumps.
  */

  if(
    !gameOver &&
    turn==='black' &&
    forcedPiece
  ){

    setTimeout(
      ()=>{

        const jumps=
          capturesFor(
            forcedPiece.row,
            forcedPiece.col
          );

        if(jumps.length){

          const jump=jumps[0];

          selected={
            row:forcedPiece.row,
            col:forcedPiece.col
          };

          attemptMove(
            jump.row,
            jump.col
          );

          if(
            turn==='black' &&
            forcedPiece
          ){
            performAIMultiJump();
          }else{
            finishAI();
          }

        }

      },
      450
    );

    return;
  }

  finishAI();
}


function performAIMultiJump(){

  if(
    gameOver ||
    turn!=='black' ||
    !forcedPiece
  ){
    finishAI();
    return;
  }

  setTimeout(
    ()=>{

      const jumps=
        capturesFor(
          forcedPiece.row,
          forcedPiece.col
        );

      if(!jumps.length){

        finishAI();
        return;

      }

      const jump=jumps[0];

      selected={
        row:forcedPiece.row,
        col:forcedPiece.col
      };

      attemptMove(
        jump.row,
        jump.col
      );

      if(
        turn==='black' &&
        forcedPiece
      ){
        performAIMultiJump();
      }else{
        finishAI();
      }

    },
    450
  );
}


function finishAI(){

  aiThinking=false;

  if(!gameOver){

    document.getElementById(
      'status'
    ).textContent=
      capitalize(turn)+"'s Turn";

  }

}


function startAI(){

  if(
    gameMode!=='ai' ||
    turn!=='black' ||
    gameOver ||
    aiThinking
  ){
    return;
  }

  aiThinking=true;

  document.getElementById(
    'status'
  ).textContent=
    'Black AI is thinking...';

  setTimeout(
    ()=>{

      const move=
        chooseAIMove();

      if(!move){

        aiThinking=false;
        checkWinner();
        return;

      }

      performAIMove(move);

    },
    650
  );
}


/* SELECTION */

function handleObject(obj){

  if(!obj || aiThinking) return;

  if(
    gameMode==='ai' &&
    turn==='black'
  ) return;

  const data=obj.userData;

  if(data.type==='piece'){

    const p=
      state[data.row][data.col];

    if(
      p &&
      p.color===turn &&
      !gameOver
    ){

      if(
        forcedPiece &&
        (
          forcedPiece.row!==data.row ||
          forcedPiece.col!==data.col
        )
      ) return;

      if(
        playerHasCapture(turn) &&
        capturesFor(
          data.row,
          data.col
        ).length===0
      ){

        document.getElementById(
          'status'
        ).textContent=
          capitalize(turn)+
          ': Capture Required';

        return;
      }

      if(selectedPieceMesh){

        selectedPieceMesh.scale.set(1,1,1);

        if(
          selectedPieceMesh.material &&
          selectedPieceMesh.material.emissive
        ){
          selectedPieceMesh.material.emissive.setHex(0x000000);
          selectedPieceMesh.material.emissiveIntensity=0;
        }

        if(
          selectedPieceMesh.userData.selectionColor !== undefined &&
          selectedPieceMesh.material &&
          selectedPieceMesh.material.color
        ){
          selectedPieceMesh.material.color.setHex(
            selectedPieceMesh.userData.selectionColor
          );
        }

        selectedPieceMesh=null;
      }

      selected={
        row:data.row,
        col:data.col
      };

      selectedPieceMesh=obj;

      /* Physical pickup feedback: selected checker lifts toward the player. */
      obj.scale.set(1.12,1.12,1.12);
      obj.position.z+=.035;
      pulseHaptics();
      gameTone(245,.045,.018,'sine');

      if(obj.material){

        if(obj.material.emissive){
          obj.material.emissive.setHex(0xffc400);
          obj.material.emissiveIntensity=1.4;
        }

        if(obj.material.color){
          obj.userData.selectionColor=
            obj.material.color.getHex();

          obj.material.color.setHex(
            0xffc400
          );
        }
      }

      highlightMoves(
        data.row,
        data.col
      );

    }

    return;

  }

  if(
    data.type==='square' &&
    data.playable
  ){

    attemptMove(
      data.row,
      data.col
    );

  }

}


/* DESKTOP CLICK */

window.addEventListener(
  'pointerdown',
  e=>{

    const mouse=
      new THREE.Vector2(
        e.clientX/innerWidth*2-1,
        -(e.clientY/innerHeight)*2+1
      );

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits=
      raycaster.intersectObjects(
        [...pieces,...cells],
        false
      );

    if(hits.length)
      handleObject(
        hits[0].object
      );

  }
);


/* VR CONTROLLERS */

function controller(index){

  const ctrl=
    renderer.xr.getController(index);

  ctrl.addEventListener(
    'connected',
    event=>{
      ctrl.userData.inputSource=event.data;
    }
  );

  const line=
    new THREE.Line(
      new THREE.BufferGeometry()
        .setFromPoints([
          new THREE.Vector3(0,0,0),
          new THREE.Vector3(0,0,-5)
        ]),
      new THREE.LineBasicMaterial({
        color:0xffdd66
      })
    );

  ctrl.add(line);

  ctrl.addEventListener(
    'selectstart',
    ()=>{
      pulseHaptics();

      tempMatrix
        .identity()
        .extractRotation(
          ctrl.matrixWorld
        );

      raycaster.ray.origin
        .setFromMatrixPosition(
          ctrl.matrixWorld
        );

      raycaster.ray.direction
        .set(0,0,-1)
        .applyMatrix4(
          tempMatrix
        );

      const hits=
        raycaster.intersectObjects(
          [...pieces,...cells],
          false
        );

      if(hits.length)
        handleObject(
          hits[0].object
        );

    }
  );

  playerRig.add(ctrl);

}

controller(0);
controller(1);


/* RESET */

document
.getElementById('restart')
.addEventListener(
  'click',
  ()=>{

    turn='red';
    selected=null;
    forcedPiece=null;
    gameOver=false;
    redCaptured=0;
    blackCaptured=0;

    resetState();
    createBoard();
    updateScore();

    document.getElementById(
      'status'
    ).textContent="Red's Turn";

  }
);


/* WALL / TABLE MODE */

document
.getElementById('mode')
.addEventListener(
  'click',
  ()=>{

    tableMode=!tableMode;

    if(tableMode){

      board.rotation.x=
        -Math.PI/2;

      board.position.set(
        0,
        .82,
        -.35
      );

    }else{

      board.rotation.x=0;

      board.position.set(
        0,
        1.6,
        0
      );

    }

  }
);



/* GAME MODE */

document
.getElementById('gameMode')
.addEventListener(
  'click',
  ()=>{

    if(aiThinking)
      return;

    gameMode=
      gameMode==='ai'
        ? 'human'
        : 'ai';

    document.getElementById(
      'gameMode'
    ).textContent=
      gameMode==='ai'
        ? 'Human vs AI'
        : 'Human vs Human';

    turn='red';
    selected=null;
    forcedPiece=null;
    gameOver=false;
    aiThinking=false;

    resetState();
    createBoard();
    updateScore();

    document.getElementById(
      'status'
    ).textContent=
      "Red's Turn";

  }
);


/* AI DIFFICULTY */

const difficultyOrder=[
  'easy',
  'medium',
  'hard',
  'expert'
];

document
.getElementById('difficulty')
.addEventListener(
  'click',
  ()=>{

    let i=
      difficultyOrder.indexOf(
        aiDifficulty
      );

    i=
      (i+1)%
      difficultyOrder.length;

    aiDifficulty=
      difficultyOrder[i];

    document.getElementById(
      'difficulty'
    ).textContent=
      'AI: '+
      capitalize(
        aiDifficulty
      );

  }
);


/* INITIAL */

resetState();

board.position.set(
  0,
  1.6,
  0
);

createBoard();
updateScore();


window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


renderer.setAnimationLoop(
  ()=>{

    renderer.render(
      scene,
      camera
    );

  }
);

</script>
</body>
</html>
